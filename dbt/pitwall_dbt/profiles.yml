pitwall:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_FILE') }}"
      role: PITWALL_PIPELINE
      warehouse: PITWALL_ELT_WH
      database: PITWALL
      schema: SILVER
      threads: 4
